[package]
name = "zk-custody"
version = "0.1.0"
edition = "2021"
description = "Zero-Knowledge chain-of-custody verification and HNOA insurance state machine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
stmp-core = { path = "../stmp-core" }
ark-ff = "0.6.0"
ark-ec = "0.6.0"
ark-bn254 = "0.6.0"
ark-groth16 = "0.6.0"
ark-relations = "0.6.0"
ark-r1cs-std = "0.6.0"
ark-snark = "0.6.0"
ark-std = "0.6.0"
ark-crypto-primitives = { version = "0.6.0", features = ["constraints", "sponge"] }
ark-serialize = "0.6.0"

[dev-dependencies]
