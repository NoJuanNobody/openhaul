[package]
name = "zk-custody"
version = "0.1.0"
edition = "2021"
description = "Zero-Knowledge chain-of-custody verification and HNOA insurance state machine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
stmp-core = { path = "../stmp-core" }

[dev-dependencies]
