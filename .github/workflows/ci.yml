name: OpenHaul CI & Verification Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  rust-core-and-zk:
    name: Rust STMP Core & ZK-Custody Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
      - name: Cargo Format Check
        run: cargo fmt --all --check
      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Core STMP & ZK Tests
        run: cargo test --workspace --verbose

  python-graph-and-chaos:
    name: Spatio-Temporal Graph Loop & Chaos Simulation
    runs-on: ubuntu-latest
    needs: rust-core-and-zk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest openpyxl numpy
      - name: Run Unit Tests
        run: pytest python/tests -v
      - name: Run Katrina Disaster Surge Chaos Simulation
        run: python3 -m python.chaos_sim.runner --scenario katrina --fleet-dropout 0.40 --verify-invariants

  business-toolchain-validation:
    name: Financial Model & SAM.gov Bid Kit Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Financial Model Generation
        run: |
          python -m pip install openpyxl
          python3 biz/generate_financial_model.py
          test -f biz/OpenHaul_Financial_Model.xlsx
      - name: Verify Governance & Insurance Specs
        run: |
          test -f biz/HNOA_Commercial_Insurance_Policy.md
          test -f biz/GOVERNANCE.md
          test -f biz/FEMA_Emergency_Logistics_Bid_Kit.md
          test -f biz/the-drift-ep1.fountain

  container-and-iac-audit:
    name: Container Build & Terraform Cloud Lint
    runs-on: ubuntu-latest
    needs: [python-graph-and-chaos, business-toolchain-validation]
    steps:
      - uses: actions/checkout@v4
      - name: Build STMP Dispatch Engine Docker Image
        run: |
          docker build -t openhaul/dispatch-engine:latest -f infra/Dockerfile .
      - name: Lint Terraform AWS EKS & Karpenter Manifests
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
      - name: Terraform Validate
        run: |
          cd infra/aws-eks
          terraform init -backend=false
          terraform validate
