apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: openhaul-burst-fleet
spec:
  template:
    metadata:
      labels:
        openhaul.network/role: graph-solver-burst
    spec:
      requirements:
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c", "m", "r"]
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["5"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]
      nodeClassRef:
        name: openhaul-default
      limits:
        cpu: "1000"
        memory: 2000Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h
